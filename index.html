<!doctype html>
<html lang="nl">
<head>
  <!-- Cliëntbezoek-app — alles in één bestand.
       Gegevens aanpassen? Zoek naar "DEEL 1". Kleuren? Zoek naar "--accent". -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2F6B57">
  <meta name="robots" content="noindex, nofollow">
  <title>Cliëntbezoek</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%232F6B57%22/%3E%3Ccircle%20cx%3D%22256%22%20cy%3D%22200%22%20r%3D%2272%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2236%22/%3E%3Cpath%20d%3D%22M128%20404a128%20128%200%200%201%20256%200%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2236%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <style>
/* ===== Kleuren en basis ===== */
:root {
  --accent: #2F6B57;
  --accent-dark: #1F4A3C;
  --accent-soft: #E3EEE8;
  --ground: #F3F5F1;
  --card: #FFFFFF;
  --ink: #1D2722;
  --muted: #5B6A62;
  --label: #4A5A52;
  --line: #E6EAE6;
  --chip: #F0F3EF;
  --warn-bg: #FFF4E5;
  --warn-ink: #6E3F08;
  --radius: 16px;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Fraunces", Georgia, serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #DDE3DE;
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button { font-family: inherit; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* De app is telefoonbreed; op een groot scherm staat hij in het midden */
.app {
  max-width: 480px;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--ground);
  overflow: hidden;
}
@media (min-width: 520px) {
  .app { box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 10px 40px rgba(0,0,0,0.08); }
}
.view { flex: 1; overflow-y: auto; outline: none; -webkit-overflow-scrolling: touch; }

/* ===== Tabbalk ===== */
.tabbar {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--card);
  border-top: 1px solid #DDE3DE;
  padding: 6px 4px calc(10px + env(safe-area-inset-bottom));
}
.tabbar a {
  min-height: 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 12px; font-weight: 500; color: #56655D; text-decoration: none;
  border-radius: 12px;
}
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabbar a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ===== Kop (groen) ===== */
.hero {
  background: var(--accent);
  color: #fff;
  padding: calc(24px + env(safe-area-inset-top)) 20px 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.hero h1 { margin: 0; font-family: var(--serif); font-size: 28px; font-weight: 600; line-height: 1.15; }
.hero .sub { font-size: 14px; font-weight: 500; opacity: .92; }
.round-btn {
  width: 44px; height: 44px; border: 0; border-radius: 22px;
  background: rgba(255,255,255,.14); color: #fff;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none;
}
.round-btn.light { background: #fff; color: var(--accent-dark); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: rgba(255,255,255,.14); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; }
.stat span { font-size: 13px; opacity: .92; }

.search {
  height: 48px; border-radius: 12px; background: #fff; color: #56655D;
  display: flex; align-items: center; gap: 10px; padding: 0 14px;
}
.search input {
  flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
  font: 16px var(--font); color: var(--ink);
}

/* ===== Filters ===== */
.filters { display: flex; gap: 8px; padding: 14px 16px 0; overflow-x: auto; }
.filters button {
  height: 40px; padding: 0 16px; border-radius: 999px; white-space: nowrap;
  border: 1px solid #D3DAD5; background: #fff; color: #2C3A33;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ===== Cliëntenlijst ===== */
.list { padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 10px; }
.client-row {
  background: var(--card); border-radius: var(--radius); padding: 14px;
  display: flex; gap: 12px; align-items: center; text-decoration: none; color: var(--ink);
}
.client-row:active { background: #FAFBFA; }
.avatar {
  width: 48px; height: 48px; border-radius: 24px; flex-shrink: 0;
  background: var(--accent-soft); color: var(--accent-dark);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-size: 18px; font-weight: 600;
}
.avatar.lg { width: 64px; height: 64px; border-radius: 32px; font-size: 24px; background: var(--ground); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.row-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-time { font-size: 14px; font-weight: 700; color: var(--label); flex-shrink: 0; }
.row-time.today { color: var(--accent); }
.row-place { font-size: 14px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
.tag { padding: 3px 9px; border-radius: 999px; background: var(--chip); color: #3E4D45; font-size: 12px; font-weight: 600; }
.tag.warn { background: var(--warn-bg); color: var(--warn-ink); font-weight: 700; }
.chev { color: #7A877F; width: 18px; height: 18px; }
.empty { padding: 40px 16px; text-align: center; color: var(--label); }

/* ===== Cliëntkaart ===== */
.person { display: flex; align-items: center; gap: 16px; }
.person .name { font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.15; }
.person .meta { font-size: 15px; opacity: .92; margin-top: 4px; }
.actions { display: flex; gap: 8px; }
.actions a {
  flex: 1; height: 44px; border-radius: 12px; text-decoration: none;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 600; font-size: 15px;
}
.actions a svg { width: 18px; height: 18px; }
.actions .primary { background: #fff; color: var(--accent-dark); }
.actions .ghost { background: rgba(255,255,255,.16); color: #fff; }

.stack { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.alert {
  background: var(--warn-bg); border-radius: 14px; padding: 14px 16px;
  display: flex; gap: 12px; align-items: flex-start; color: #5A3407;
}
.alert svg { stroke: #9A5B12; width: 20px; height: 20px; margin-top: 1px; }
.alert b { display: block; color: var(--warn-ink); font-size: 15px; margin-bottom: 2px; }
.alert p { margin: 0; font-size: 14px; line-height: 1.45; }

.card { background: var(--card); border-radius: var(--radius); padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--label); }
.field small { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.field div { font-size: 16px; font-weight: 500; }
.fields { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); font-size: 14px; font-weight: 600; }
.kv { display: flex; flex-direction: column; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.kv > div:last-child { border-bottom: 0; }
.kv span { font-size: 14px; color: var(--muted); }
.kv b { font-size: 15px; text-align: right; }
.card p { margin: 0; font-size: 15px; line-height: 1.55; }
.bullets { display: flex; flex-direction: column; gap: 8px; }
.bullets div { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.45; }
.bullets svg { stroke: var(--accent); width: 18px; height: 18px; margin-top: 2px; }
.contact { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.contact .who { font-size: 16px; font-weight: 600; }
.contact .how { font-size: 14px; color: var(--muted); margin-top: 2px; }
.call-btn {
  width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0;
  background: var(--accent-soft); color: var(--accent-dark);
  display: flex; align-items: center; justify-content: center;
}
.footnote { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 0 8px; }

/* ===== Nog niet uitgewerkte tabbladen ===== */
.placeholder {
  min-height: 100%; padding: 64px 32px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;
}
.placeholder h1 { margin: 0; font-family: var(--serif); font-size: 26px; font-weight: 600; }
.placeholder p { margin: 0; max-width: 300px; font-size: 15px; line-height: 1.5; color: var(--label); }

/* ===== Uitbreiding: bezoeken, verslagen, uren, berichten ===== */
.hero-btns { display: flex; gap: 8px; }
.hero-sm { padding-bottom: 18px; gap: 10px; }
.hero-sm .person .name { font-size: 22px; }
.hero-sm .avatar { background: var(--ground); }
a.stat { color: #fff; text-decoration: none; }
.stat-warn { background: #FFF4E5 !important; color: var(--warn-ink) !important; }
.round-btn:disabled { opacity: .35; cursor: default; }

.btn {
  min-height: 48px; width: 100%; border-radius: 12px; border: 0; padding: 0 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 600 16px var(--font); text-decoration: none; cursor: pointer;
}
.btn svg { width: 20px; height: 20px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active { background: var(--accent-dark); }
.btn-secondary { background: var(--accent-soft); color: var(--accent-dark); }
.btn-ghost { background: transparent; color: var(--accent-dark); }
.btn-ghost.danger { color: #9B2C1F; }
.btn-sm { min-height: 44px; width: auto; font-size: 15px; }
.btn:disabled { opacity: .45; cursor: default; }

.pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.pill-gepland { background: #E8EDF3; color: #2D4A66; }
.pill-bezig { background: #2F6B57; color: #fff; }
.pill-voltooid { background: var(--accent-soft); color: var(--accent-dark); }
.pill-accorderen { background: var(--warn-bg); color: var(--warn-ink); }
.hero .pill-voltooid, .hero .pill-gepland { background: rgba(255,255,255,.9); }
.hero .pill-bezig { background: #fff; color: var(--accent-dark); }

.sec { margin: 4px 4px 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--label); }
.list-flat { display: flex; flex-direction: column; gap: 10px; }
.time-col { width: 56px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-start; }
.time-col b { font-size: 15px; color: var(--accent-dark); }
.time-col span { font-size: 13px; color: var(--muted); }
a.alert { text-decoration: none; }

.note-ok { display: flex; gap: 10px; align-items: center; background: var(--accent-soft); color: var(--accent-dark); border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.note-ok svg { width: 20px; height: 20px; }

.form { gap: 14px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: var(--label); }
.form input[type="time"], .form input[type="number"], .form textarea, .form select, .select-label select {
  width: 100%; min-height: 48px; border: 1px solid #CBD3CE; border-radius: 12px; padding: 10px 12px;
  font: 400 16px var(--font); color: var(--ink); background: #fff;
}
.form textarea { resize: vertical; line-height: 1.5; }
.form input:focus, .form textarea:focus, .form select:focus, .select-label select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.form label.check { flex-direction: row; align-items: flex-start; gap: 12px; font-weight: 500; color: var(--ink); font-size: 15px; line-height: 1.4; }
.form label.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); flex-shrink: 0; }
.opt { font-weight: 400; color: var(--muted); }
.hint { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.hint.center { text-align: center; }
.error { margin: 0; color: #9B2C1F; font-size: 14px; font-weight: 600; min-height: 0; }
.error:empty { display: none; }
.photo-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.photo-row label.btn { flex-direction: row; color: var(--accent-dark); font-size: 15px; }
.select-label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: var(--label); }

.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs:empty { display: none; }
.thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; display: block; }
.thumb { position: relative; }
.thumb button { position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 14px; border: 0; background: #1D2722; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.thumb button svg { width: 14px; height: 14px; }

.reports, .msgs { display: flex; flex-direction: column; gap: 10px; }
.report, .msg { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: var(--chip); color: var(--ink); text-decoration: none; }
.stack > .reports .report { background: var(--card); }
.report-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.report-top b { font-size: 15px; }
.report-top span { font-size: 13px; color: var(--muted); flex-shrink: 0; }
.report p, .msg p { margin: 0; font-size: 15px; line-height: 1.5; white-space: pre-line; }
.report .tag { align-self: flex-start; }
.muted { color: var(--muted) !important; }
.link-more { font-size: 15px; font-weight: 600; }

.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-nav h1 { font-size: 24px; text-align: center; }
.table-card { padding: 8px 0 16px; overflow-x: auto; }
table.uren { width: 100%; border-collapse: collapse; font-size: 14px; }
table.uren th { text-align: left; font-size: 12px; font-weight: 700; color: var(--label); padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.uren td { padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.uren th:first-child, table.uren td:first-child { padding-left: 16px; }
table.uren th:last-child, table.uren td:last-child { padding-right: 16px; }
table.uren .r { text-align: right; }
.totals { padding: 4px 16px 0; }
.totals .grand { border-top: 2px solid var(--ink); border-bottom: 0; padding-top: 12px; }
.totals .grand span { color: var(--ink); font-weight: 700; font-size: 15px; }
.totals .grand b { font-size: 17px; }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  max-width: min(440px, calc(100% - 32px)); background: #1D2722; color: #fff; padding: 12px 16px; border-radius: 12px;
  font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
table.uren td small { display: block; font-size: 12px; color: var(--muted); }
table.uren td.wrap { white-space: normal; }

/* ===== Intakeformulier ===== */
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.req { color: #9B2C1F; }
.steps { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.steps li { height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); }
.steps li.done { background: rgba(255,255,255,.75); }
.steps li.now { background: #fff; }
.form input[type="text"], .form input[type="email"], .form input[type="tel"], .form input[type="date"] {
  width: 100%; min-height: 48px; border: 1px solid #CBD3CE; border-radius: 12px; padding: 10px 12px;
  font: 400 16px var(--font); color: var(--ink); background: #fff;
}
.grid-aanhef { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; }
.form fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.form legend { padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--label); }
.chk-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.form label.chip-check { flex-direction: row; gap: 0; position: relative; }
.chip-check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip-check span {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px;
  border: 1px solid #CBD3CE; background: #fff; color: #2C3A33; font-size: 15px; font-weight: 600; cursor: pointer;
}
.chip-check input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip-check input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.rooster-rows { display: flex; flex-direction: column; gap: 8px; }
.rooster-row { display: grid; grid-template-columns: 76px minmax(0,1fr) minmax(0,1fr) 44px; gap: 8px; align-items: center; }
.rooster-row label { gap: 0 !important; }
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 22px; background: var(--chip); color: var(--label); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.icon-btn svg { width: 18px; height: 18px; }
.form .btn-sm { align-self: flex-start; }
.nav-btns { margin-top: 2px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent-dark); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
#printArea { display: none; }

@media print {
  body { background: #fff; }
  .app { display: none !important; }
  .toast { display: none !important; }
  #printArea { display: block; font-family: var(--font); color: #000; font-size: 11pt; padding: 0 8mm; }
  #printArea h1 { font-family: var(--serif); font-size: 18pt; margin: 0 0 6mm; }
  #printArea h2 { font-size: 12pt; margin: 6mm 0 2mm; border-bottom: 1px solid #000; padding-bottom: 1mm; }
  #printArea table { width: 100%; border-collapse: collapse; }
  #printArea th { text-align: left; width: 38%; font-weight: 600; padding: 1.5mm 2mm 1.5mm 0; vertical-align: top; }
  #printArea td { padding: 1.5mm 0; vertical-align: top; white-space: pre-line; }
  #printArea tr { break-inside: avoid; }
  #printArea .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 12mm; margin-top: 14mm; break-inside: avoid; }
  #printArea .sign span { display: block; border-bottom: 1px solid #000; height: 18mm; }
}
.rooster-row { grid-template-columns: 64px minmax(0,1fr) minmax(0,1fr) 44px; gap: 6px; }
.rooster-row select, .rooster-row input[type="time"] { padding: 8px 6px !important; font-size: 15px !important; }

  </style>
</head>
<body>
  <div class="app">
    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Hoofdmenu">
      <a href="#/clienten" data-tab="clienten">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
        Cliënten
      </a>
      <a href="#/client" data-tab="client">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        Cliënt
      </a>
      <a href="#/bezoek" data-tab="bezoek">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>

  <script>
/* Cliëntbezoek-app — werkt zonder server, dus ook op GitHub Pages.
   Navigatie met links als #/clienten, #/client/annie, #/dienst/<id>.

   Wat de zorgverlener invult (start- en eindtijd, kilometers, verslag,
   foto's, verzonden berichten) wordt bewaard op DIT apparaat
   (localStorage). Er gaat niets naar internet. */
(function () {
  "use strict";

  var baseClients = window.CLIENTEN || [];
  var clients = baseClients.slice();
  var ORG = window.ORGANISATIE || { coordinator: {}, kmVergoeding: 0 };
  var view = document.getElementById("view");
  var tabs = document.querySelectorAll(".tabbar a");

  var state = {
    filter: "vandaag", query: "",
    lastClient: clients.length ? clients[0].id : null,
    verslagClient: "", urenMaand: null, edit: null, prefill: null
  };
  var draftFotos = {};

  var DAGNR = { ma: 1, di: 2, wo: 3, do: 4, vr: 5, za: 6, zo: 7 };
  var DAGNAAM = ["", "ma", "di", "wo", "do", "vr", "za", "zo"];
  var WAARSCHUW_DAGEN = 60;
  var DEMO_TEKSTEN = [
    "Samen koffie gedronken en een stukje gewandeld. {n} was goedgemutst.",
    "Boodschappen gedaan en samen geluncht. Geen bijzonderheden.",
    "Oude foto’s bekeken en veel verhalen gehoord. {n} genoot ervan.",
    "Spelletje gedaan en de krant doorgenomen. Rustige, gezellige middag.",
    "Even naar buiten geweest en daarna samen thee gedronken. {n} was wat moe, verder goed."
  ];

  // ---------- Opslag op dit apparaat ----------
  var KEY = "clientbezoek.v1";
  var store = { diensten: {}, berichten: [], clienten: [], intakeConcept: null };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var parsed = JSON.parse(raw); store.diensten = parsed.diensten || {}; store.berichten = parsed.berichten || []; store.clienten = parsed.clienten || []; store.intakeConcept = parsed.intakeConcept || null; }
  } catch (e) { /* geen opslag beschikbaar: app werkt, maar onthoudt niets */ }
  // Cliënten uit DEEL 1 plus cliënten die via het intakeformulier zijn toegevoegd
  function rebuildClients() { clients = baseClients.concat(store.clienten); }
  rebuildClients();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); return true; }
    catch (e) { toast("Opslaan mislukt: het geheugen van de app is vol. Verwijder oude foto’s."); return false; }
  }

  // ---------- Hulpjes ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function fromYmd(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function isoDay(d) { return d.getDay() || 7; }
  function nowHM() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function mins(hm) { var p = String(hm || "0:0").split(":"); return (+p[0]) * 60 + (+p[1]); }
  function uren(van, tot) { return Math.max(0, mins(tot) - mins(van)) / 60; }
  function euro(n) { return "€ " + n.toFixed(2).replace(".", ","); }
  function num(n, d) { return n.toFixed(d == null ? 2 : d).replace(".", ","); }
  function today() { return ymd(new Date()); }
  function datumKort(s) {
    var d = fromYmd(s);
    return DAGNAAM[isoDay(d)] + " " + d.getDate() + " " + d.toLocaleDateString("nl-NL", { month: "short" }).replace(".", "");
  }
  function datumLang(s) {
    var t = fromYmd(s).toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function initials(c) {
    var a = (c.voornaam || c.achternaam || "?").charAt(0);
    var parts = (c.achternaam || "").replace(/^(de|van|der|den|ter|ten|het)\s+/gi, "").split(/[\s-]/);
    var b = (parts[0] || "").charAt(0);
    return (c.voornaam ? a + b : b).toUpperCase();
  }
  function displayName(c) {
    return [c.aanhef, c.roepnaam && c.aanhef !== "Fam." ? c.roepnaam : "", c.aanhef === "Fam." ? c.achternaam : c.achternaam.split("-")[0]]
      .filter(Boolean).join(" ");
  }
  function parseNL(s) {
    var m = /^(\d{2})-(\d{2})-(\d{4})$/.exec(s || "");
    return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null;
  }
  function age(c) {
    var d = parseNL(c.geboortedatum);
    if (!d) return null;
    var now = new Date(), a = now.getFullYear() - d.getFullYear();
    if (now < new Date(now.getFullYear(), d.getMonth(), d.getDate())) a--;
    return a;
  }
  function expiresSoon(c) {
    var d = parseNL(c.indicatieTot);
    return d ? (d - new Date()) / 86400000 <= WAARSCHUW_DAGEN : false;
  }
  function onlyHousekeeping(c) { return c.zorg.length === 1 && c.zorg[0] === "Hulp in huis"; }
  function telLink(n) { return "tel:" + String(n || "").replace(/[^\d+]/g, ""); }
  function findClient(id) {
    for (var i = 0; i < clients.length; i++) if (clients[i].id === id) return clients[i];
    return null;
  }
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
  }

  // ---------- Bezoeken (diensten) uit het rooster ----------
  function dienstId(cid, datum, van) { return cid + "_" + datum + "_" + van.replace(":", ""); }
  function genDiensten(from, to) {
    var out = [];
    for (var d = new Date(from); d <= to; d = addDays(d, 1)) {
      var dn = isoDay(d), ds = ymd(d);
      clients.forEach(function (c) {
        if (c.startdatum && ds < c.startdatum) return;
        (c.rooster || []).forEach(function (r) {
          if (DAGNR[r.dag] === dn) out.push({ id: dienstId(c.id, ds, r.van), client: c, datum: ds, van: r.van, tot: r.tot, tarief: c.tarief || 0 });
        });
      });
    }
    return out.sort(function (a, b) { return (a.datum + a.van).localeCompare(b.datum + b.van); });
  }
  function getDienst(id) {
    var p = id.split("_");
    if (p.length !== 3) return null;
    var list = genDiensten(fromYmd(p[1]), fromYmd(p[1]));
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function monthDiensten(y, m) { return genDiensten(new Date(y, m, 1), new Date(y, m + 1, 0)); }

  // Wat er over een bezoek bekend is: zelf ingevuld, of voorbeeld uit het verleden
  function record(d) {
    var r = store.diensten[d.id];
    if (r) return r;
    if (ORG.demoGeschiedenis && d.datum < ymd(addDays(new Date(), -2))) {
      var t = onlyHousekeeping(d.client) ? "" : DEMO_TEKSTEN[(fromYmd(d.datum).getDate() + clients.indexOf(d.client) * 2) % DEMO_TEKSTEN.length].replace("{n}", d.client.roepnaam);
      return { status: "voltooid", van: d.van, tot: d.tot, km: 6 + hash(d.id) % 12, opmerking: t, zichtbaar: true, fotos: [], demo: true };
    }
    return null;
  }
  function status(d) {
    var r = record(d);
    if (r && r.status === "voltooid") return "voltooid";
    if (r && r.status === "bezig") return "bezig";
    if (d.datum < today() || (d.datum === today() && mins(nowHM()) > mins(d.tot))) return "accorderen";
    return "gepland";
  }
  var STATUS_LABEL = { gepland: "Gepland", bezig: "Bezig", voltooid: "Voltooid", accorderen: "Nog accorderen" };

  function nextDienst(c) {
    var list = genDiensten(new Date(), addDays(new Date(), 14)).filter(function (d) { return d.client.id === c.id && status(d) !== "voltooid"; });
    return list[0] || null;
  }
  function openToAccord() {
    var now = new Date();
    return genDiensten(new Date(now.getFullYear(), now.getMonth() - 1, 1), now).filter(function (d) { return status(d) === "accorderen"; });
  }

  // ---------- Iconen ----------
  var ICON = {
    plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    search: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    left: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    right: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
    phone: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
    pin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    warn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
    heart: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
    info: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>',
    ear: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 0 1 18 0v4a2 2 0 0 1-2 2h-1v-6h3M3 11v4a2 2 0 0 0 2 2h1v-6H3"/></svg>',
    mail: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>',
    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
    camera: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg>',
    download: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg>',
    eye: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  function statusPill(s) { return '<span class="pill pill-' + s + '">' + STATUS_LABEL[s] + '</span>'; }

  // ---------- Scherm: cliëntenoverzicht ----------
  function weekSet() {
    var ids = {};
    genDiensten(new Date(), addDays(new Date(), 6)).forEach(function (d) { ids[d.client.id] = true; });
    return ids;
  }
  function todaySet() {
    var ids = {};
    genDiensten(new Date(), new Date()).forEach(function (d) { ids[d.client.id] = d; });
    return ids;
  }
  function filtered() {
    var q = state.query.trim().toLowerCase(), wk = weekSet(), td = todaySet();
    return clients.filter(function (c) {
      if (state.filter === "vandaag" && !td[c.id]) return false;
      if (state.filter === "week" && !wk[c.id]) return false;
      if (q && (displayName(c) + " " + c.achternaam + " " + c.woonplaats).toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).map(function (c) { return { c: c, next: nextDienst(c) }; })
      .sort(function (a, b) {
        var ka = a.next ? a.next.datum + a.next.van : "9", kb = b.next ? b.next.datum + b.next.van : "9";
        return ka.localeCompare(kb);
      });
  }
  function rowHtml(o) {
    var c = o.c, n = o.next, when = "";
    if (n) when = n.datum === today() ? n.van : DAGNAAM[isoDay(fromYmd(n.datum))] + " " + n.van;
    return '<a class="client-row" href="#/client/' + esc(c.id) + '">' +
      '<div class="avatar" aria-hidden="true">' + esc(initials(c)) + '</div>' +
      '<div class="row-main">' +
        '<div class="row-top"><div class="row-name">' + esc(displayName(c)) + '</div>' +
        '<div class="row-time' + (n && n.datum === today() ? ' today' : '') + '">' + esc(when) + '</div></div>' +
        '<div class="row-place">' + esc(c.woonplaats) + '</div>' +
        '<div class="tags"><span class="tag">' + esc(c.zorg[0] || "") + '</span>' +
        '<span class="tag">' + esc(c.financiering.replace(/ gemeente .*$/, "").replace(" · ", " ")) + '</span>' +
        (expiresSoon(c) ? '<span class="tag warn">Indicatie verloopt</span>' : '') +
        '</div>' +
      '</div>' + ICON.chev + '</a>';
  }
  function renderList() {
    var box = document.getElementById("list");
    if (!box) return;
    var rows = filtered();
    box.innerHTML = rows.length ? rows.map(rowHtml).join("") : '<div class="empty">Geen cliënten gevonden.</div>';
    document.querySelectorAll(".filters button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.filter === state.filter));
    });
  }
  function renderOverview() {
    var nToday = genDiensten(new Date(), new Date()).length;
    var nOpen = openToAccord().length;
    var nWarn = clients.filter(expiresSoon).length;
    view.innerHTML =
      '<header class="hero">' +
        '<div class="hero-top"><div><div class="sub">' + esc(datumLang(today())) + '</div><h1>Mijn cliënten</h1></div>' +
        '<div class="hero-btns">' +
          '<a class="round-btn" href="#/berichten" aria-label="Berichten aan coördinator">' + ICON.mail + '</a>' +
          '<a class="round-btn light" href="#/nieuw" aria-label="Nieuwe cliënt toevoegen">' + ICON.plus + '</a>' +
        '</div></div>' +
        '<div class="stats">' +
          '<a class="stat" href="#/bezoek"><b>' + nToday + '</b><span>bezoeken vandaag</span></a>' +
          '<a class="stat' + (nOpen ? ' stat-warn' : '') + '" href="#/bezoek"><b>' + nOpen + '</b><span>nog accorderen</span></a>' +
          '<div class="stat"><b>' + nWarn + '</b><span>indicatie verloopt</span></div>' +
        '</div>' +
        '<label class="search">' + ICON.search +
          '<input id="q" type="search" placeholder="Zoek op naam of woonplaats" aria-label="Zoek cliënt" autocomplete="off" value="' + esc(state.query) + '">' +
        '</label>' +
      '</header>' +
      '<div class="filters" role="group" aria-label="Filter">' +
        '<button type="button" data-filter="vandaag">Vandaag</button>' +
        '<button type="button" data-filter="week">Deze week</button>' +
        '<button type="button" data-filter="alle">Alle cliënten</button>' +
      '</div>' +
      '<div class="list" id="list"></div>';
    renderList();
    document.getElementById("q").addEventListener("input", function (e) { state.query = e.target.value; renderList(); });
    document.querySelectorAll(".filters button").forEach(function (b) {
      b.addEventListener("click", function () { state.filter = b.dataset.filter; renderList(); });
    });
  }

  // ---------- Scherm: cliëntkaart ----------
  function field(label, value) { return '<div class="field"><small>' + esc(label) + '</small><div>' + esc(value) + '</div></div>'; }
  function kv(label, value) { return '<div><span>' + esc(label) + '</span><b>' + esc(value) + '</b></div>'; }
  function roosterTekst(c) {
    return (c.rooster || []).map(function (r) { return r.dag + " " + r.van + "–" + r.tot; }).join(", ") || "—";
  }
  function recentReports(filterId, days) {
    var now = new Date();
    return genDiensten(addDays(now, -(days || 60)), now).filter(function (d) {
      if (filterId && d.client.id !== filterId) return false;
      var r = record(d);
      return r && r.status === "voltooid";
    }).reverse();
  }
  function reportItem(d, showClient) {
    var r = record(d);
    return '<a class="report" href="#/dienst/' + esc(d.id) + '">' +
      '<div class="report-top"><b>' + esc(showClient ? displayName(d.client) : datumKort(d.datum)) + '</b>' +
      '<span>' + esc((showClient ? datumKort(d.datum) + " · " : "") + r.van + "–" + r.tot) + '</span></div>' +
      (r.opmerking ? '<p>' + esc(r.opmerking) + '</p>' : '<p class="muted">Geen verslag (hulp in huis).</p>') +
      ((r.fotos && r.fotos.length) ? '<div class="thumbs">' + r.fotos.map(function (f) { return '<img src="' + f + '" alt="Foto bij bezoek">'; }).join("") + '</div>' : '') +
      (r.signaal ? '<span class="tag warn">Bijzonderheid gemeld</span>' : '') +
    '</a>';
  }
  function renderClient(id) {
    var c = findClient(id || state.lastClient);
    if (!c) { location.hash = "#/clienten"; return; }
    state.lastClient = c.id;
    var n = nextDienst(c);
    var sub = n ? (n.datum === today() ? "Bezoek vandaag · " + n.van + " – " + n.tot : "Volgend bezoek · " + datumKort(n.datum) + " " + n.van) : "Geen bezoek gepland";
    var a = age(c);
    var adres = c.adres + ", " + c.postcode + " " + c.woonplaats;
    var route = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(adres);
    var reps = recentReports(c.id, 60).slice(0, 3);

    view.innerHTML =
      '<header class="hero">' +
        '<div class="hero-top">' +
          '<a class="round-btn" href="#/clienten" aria-label="Terug naar cliëntenoverzicht">' + ICON.back + '</a>' +
          '<div class="sub">' + esc(sub) + '</div><span style="width:44px"></span>' +
        '</div>' +
        '<div class="person"><div class="avatar lg" aria-hidden="true">' + esc(initials(c)) + '</div>' +
          '<div><h1 class="name">' + esc(displayName(c)) + '</h1>' +
          '<div class="meta">' + [a !== null ? a + ' jaar' : '', c.voornaam ? 'noemt zich “' + esc(c.roepnaam) + '”' : ''].filter(Boolean).join(' · ') + '</div></div></div>' +
        '<div class="actions">' +
          '<a class="primary" href="' + telLink(c.telefoon) + '">' + ICON.phone + 'Bellen</a>' +
          '<a class="ghost" href="' + route + '" target="_blank" rel="noopener">' + ICON.pin + 'Route</a>' +
        '</div>' +
      '</header>' +
      '<div class="stack">' +
        (n && n.datum === today() ? '<a class="btn btn-primary" href="#/dienst/' + esc(n.id) + '">' + ICON.play + 'Open bezoek van vandaag</a>' : '') +
        (c.letOp ? '<div class="alert">' + ICON.warn + '<div><b>Let op bij binnenkomst</b><p>' + esc(c.letOp) + '</p></div></div>' : '') +
        '<section class="card"><h2>Persoonsgegevens</h2><div class="fields">' +
          field("Naam", [c.aanhef, c.voornaam, c.achternaam].filter(Boolean).join(" ")) +
          '<div class="field"><small>Adres</small><div>' + esc(c.adres) + '</div><div>' + esc(c.postcode + " " + c.woonplaats) + '</div></div>' +
          '<div class="grid2">' + field("Telefoon", c.telefoon) + field("Geboortedatum", c.geboortedatum) + '</div>' +
          '<div class="grid2">' + field("Huisarts", c.huisarts) + field("Cliëntnummer", c.clientnummer) + '</div>' +
        '</div></section>' +
        '<section class="card"><h2>Zorg &amp; afspraken</h2>' +
          '<div class="chips">' + c.zorg.map(function (z) { return '<span class="chip">' + esc(z) + '</span>'; }).join("") + '</div>' +
          '<div class="kv">' +
            kv("Financiering", c.financiering) + kv("Vaste momenten", roosterTekst(c)) + kv("Uren per bezoek", c.urenPerBezoek) +
            kv("Vaste zorgverlener", c.zorgverlener) + kv("Indicatie geldig t/m", c.indicatieTot) +
          '</div></section>' +
        '<section class="card"><h2>Over ' + esc(c.roepnaam) + '</h2>' +
          '<p>' + esc(c.over) + '</p>' +
          '<div class="bullets">' +
            '<div>' + ICON.heart + '<div><b>Vindt fijn:</b> ' + esc(c.fijn) + '</div></div>' +
            '<div>' + ICON.info + '<div><b>Liever niet:</b> ' + esc(c.liever) + '</div></div>' +
            '<div>' + ICON.ear + '<div><b>Communicatie:</b> ' + esc(c.communicatie) + '</div></div>' +
          '</div></section>' +
        '<section class="card"><h2>Laatste verslagen</h2>' +
          (reps.length ? '<div class="reports">' + reps.map(function (d) { return reportItem(d, false); }).join("") + '</div>' +
            '<a class="link-more" href="#/verslag" data-client="' + esc(c.id) + '" id="allReports">Alle verslagen van ' + esc(c.roepnaam) + '</a>'
            : '<p class="muted">Nog geen verslagen.</p>') +
        '</section>' +
        '<section class="card"><h2>Eerste contactpersoon</h2>' +
          '<div class="contact"><div><div class="who">' + esc(c.contact.naam) + '</div>' +
          '<div class="how">' + esc(c.contact.relatie) + ' · ' + esc(c.contact.telefoon) + '</div></div>' +
          '<a class="call-btn" href="' + telLink(c.contact.telefoon) + '" aria-label="Bel ' + esc(c.contact.naam) + '">' + ICON.phone + '</a></div>' +
        '</section>' +
        (c.eigen ? '<a class="btn btn-secondary" href="#/intake/' + esc(c.id) + '">Intakegegevens bewerken</a>' : '') +
        '<div class="footnote">Laatst bijgewerkt: ' + esc(c.bijgewerkt.datum) + ' door ' + esc(c.bijgewerkt.door) + '</div>' +
      '</div>';
    var all = document.getElementById("allReports");
    if (all) all.addEventListener("click", function () { state.verslagClient = c.id; });
  }

  // ---------- Scherm: bezoeken ----------
  function dienstRow(d, showDate) {
    var s = status(d), r = record(d);
    var t = s === "bezig" ? "gestart " + r.start : (s === "voltooid" ? r.van + "–" + r.tot : d.van + "–" + d.tot);
    return '<a class="client-row" href="#/dienst/' + esc(d.id) + '">' +
      '<div class="time-col"><b>' + esc(showDate ? datumKort(d.datum) : d.van) + '</b><span>' + esc(showDate ? d.van : d.tot) + '</span></div>' +
      '<div class="row-main"><div class="row-name">' + esc(displayName(d.client)) + '</div>' +
      '<div class="row-place">' + esc(d.client.woonplaats + " · " + t) + '</div>' +
      '<div class="tags">' + statusPill(s) + '</div></div>' + ICON.chev + '</a>';
  }
  function renderBezoek() {
    var td = genDiensten(new Date(), new Date());
    var open = openToAccord().filter(function (d) { return d.datum !== today(); });
    var komend = genDiensten(addDays(new Date(), 1), addDays(new Date(), 7));
    view.innerHTML =
      '<header class="hero hero-sm"><div class="sub">' + esc(datumLang(today())) + '</div><h1>Bezoeken</h1></header>' +
      '<div class="stack">' +
        (open.length ? '<div class="alert">' + ICON.warn + '<div><b>' + open.length + ' bezoek' + (open.length > 1 ? 'en' : '') + ' nog accorderen</b>' +
          '<p>Rond je bezoek zo snel mogelijk af: dan klopt je urenoverzicht en wordt je sneller betaald.</p></div></div>' : '') +
        (open.length ? '<section><h2 class="sec">Nog accorderen</h2><div class="list-flat">' + open.map(function (d) { return dienstRow(d, true); }).join("") + '</div></section>' : '') +
        '<section><h2 class="sec">Vandaag</h2><div class="list-flat">' +
          (td.length ? td.map(function (d) { return dienstRow(d, false); }).join("") : '<div class="empty">Geen bezoeken vandaag.</div>') +
        '</div></section>' +
        '<section><h2 class="sec">Komende 7 dagen</h2><div class="list-flat">' +
          (komend.length ? komend.map(function (d) { return dienstRow(d, true); }).join("") : '<div class="empty">Geen bezoeken gepland.</div>') +
        '</div></section>' +
      '</div>';
  }

  // ---------- Scherm: één bezoek (starten, afronden, verslag) ----------
  function renderDienst(id) {
    var d = getDienst(id);
    if (!d) { location.hash = "#/bezoek"; return; }
    var c = d.client, s = status(d), r = record(d) || {};
    var editing = s !== "voltooid" || state.edit === id;
    state.lastClient = c.id;
    if (!draftFotos[id]) draftFotos[id] = (r.fotos || []).slice();

    var head =
      '<header class="hero hero-sm">' +
        '<div class="hero-top"><a class="round-btn" href="#/bezoek" aria-label="Terug naar bezoeken">' + ICON.back + '</a>' + statusPill(s) + '</div>' +
        '<div class="person"><div class="avatar" aria-hidden="true">' + esc(initials(c)) + '</div><div>' +
        '<h1 class="name">' + esc(displayName(c)) + '</h1>' +
        '<div class="meta">' + esc(datumLang(d.datum) + " · " + d.van + "–" + d.tot) + '</div></div></div>' +
      '</header>';

    var body = '<div class="stack">';
    if (c.letOp && s !== "voltooid") body += '<div class="alert">' + ICON.warn + '<div><b>Let op bij binnenkomst</b><p>' + esc(c.letOp) + '</p></div></div>';

    if (!editing) {
      body +=
        '<section class="card"><h2>Afgerond</h2><div class="kv">' +
          kv("Gewerkt", r.van + " – " + r.tot + " (" + num(uren(r.van, r.tot)) + " uur)") +
          kv("Kilometers", (r.km || 0) + " km") +
          kv("Zichtbaar voor familie", r.zichtbaar ? "Ja" : "Nee") +
        '</div></section>' +
        '<section class="card"><h2>Verslag</h2>' + (r.opmerking ? '<p>' + esc(r.opmerking) + '</p>' : '<p class="muted">Geen verslag.</p>') +
          ((r.fotos && r.fotos.length) ? '<div class="thumbs">' + r.fotos.map(function (f) { return '<img src="' + f + '" alt="Foto bij bezoek">'; }).join("") + '</div>' : '') +
        '</section>' +
        (r.demo ? '<p class="footnote">Dit is een voorbeeldbezoek.</p>' : '<button class="btn btn-secondary" type="button" id="editBtn">Wijzigen</button>');
    } else {
      if (s === "gepland" && d.datum === today()) {
        body += '<button class="btn btn-primary" type="button" id="startBtn">' + ICON.play + 'Start bezoek</button>';
      }
      if (s === "bezig") {
        body += '<div class="note-ok">' + ICON.check + '<span>Bezoek gestart om <b>' + esc(r.start) + '</b>. Rond hieronder af als je klaar bent.</span></div>';
      }
      var van = r.van || r.start || d.van;
      var tot = r.tot || (s === "bezig" ? nowHM() : d.tot);
      var verplicht = !onlyHousekeeping(c);
      body +=
        '<form class="card form" id="doneForm" novalidate><h2>Bezoek afronden</h2>' +
          '<div class="grid2">' +
            '<label>Van<input type="time" id="fVan" value="' + esc(van) + '" required></label>' +
            '<label>Tot<input type="time" id="fTot" value="' + esc(tot) + '" required></label>' +
          '</div>' +
          '<label>Gereden kilometers<input type="number" id="fKm" inputmode="numeric" min="0" step="1" value="' + esc(r.km != null ? r.km : "") + '" placeholder="0"></label>' +
          '<label>Wat heb je met of voor ' + esc(c.roepnaam) + ' gedaan?' + (verplicht ? '' : ' <span class="opt">(alleen bij bijzonderheden)</span>') +
            '<textarea id="fTekst" rows="5" placeholder="Bijvoorbeeld: samen gewandeld naar het park en koffie gedronken. ' + esc(c.roepnaam) + ' was goedgemutst.">' + esc(r.opmerking || "") + '</textarea></label>' +
          '<p class="hint">Tip: tik op het microfoontje van je toetsenbord en spreek je verslag in.</p>' +
          '<label class="check"><input type="checkbox" id="fZicht"' + (r.zichtbaar === false ? '' : ' checked') + '><span>Verslag zichtbaar voor familie / contactpersoon</span></label>' +
          '<label class="check"><input type="checkbox" id="fSignaal"' + (r.signaal ? ' checked' : '') + '><span>Ik heb iets opvallends gezien en wil dit melden aan de coördinator</span></label>' +
          '<div class="photo-row"><label class="btn btn-secondary btn-sm">' + ICON.camera + 'Foto toevoegen<input type="file" id="fFoto" accept="image/*" hidden></label>' +
            '<span class="hint">Alleen met toestemming van de cliënt.</span></div>' +
          '<div class="thumbs" id="thumbs"></div>' +
          '<p class="error" id="fErr" role="alert"></p>' +
          '<button class="btn btn-primary" type="submit">' + ICON.check + 'Taak voltooien</button>' +
          (state.edit === id ? '<button class="btn btn-ghost" type="button" id="cancelEdit">Annuleren</button>' : '') +
        '</form>';
      if (s !== "voltooid") body += '<button class="btn btn-ghost danger" type="button" id="cantCome">Ik kan niet komen — afmelden</button>';
    }
    body += '</div>';
    view.innerHTML = head + body;

    // knoppen
    var start = document.getElementById("startBtn");
    if (start) start.addEventListener("click", function () {
      store.diensten[id] = { status: "bezig", start: nowHM() };
      if (save()) toast("Bezoek gestart om " + store.diensten[id].start);
      renderDienst(id);
    });
    var edit = document.getElementById("editBtn");
    if (edit) edit.addEventListener("click", function () { state.edit = id; draftFotos[id] = (r.fotos || []).slice(); renderDienst(id); });
    var cancel = document.getElementById("cancelEdit");
    if (cancel) cancel.addEventListener("click", function () { state.edit = null; delete draftFotos[id]; renderDienst(id); });
    var cant = document.getElementById("cantCome");
    if (cant) cant.addEventListener("click", function () {
      state.prefill = { type: "Planning / ziekmelding", client: c.id,
        tekst: "Ik kan helaas niet komen bij " + displayName(c) + " op " + datumLang(d.datum).toLowerCase() + " (" + d.van + "–" + d.tot + "). Reden: " };
      location.hash = "#/berichten";
    });

    var form = document.getElementById("doneForm");
    if (!form) return;
    function drawThumbs() {
      var box = document.getElementById("thumbs");
      box.innerHTML = draftFotos[id].map(function (f, i) {
        return '<div class="thumb"><img src="' + f + '" alt="Foto ' + (i + 1) + '"><button type="button" data-i="' + i + '" aria-label="Verwijder foto ' + (i + 1) + '">' + ICON.x + '</button></div>';
      }).join("");
      box.querySelectorAll("button").forEach(function (b) {
        b.addEventListener("click", function () { draftFotos[id].splice(+b.dataset.i, 1); drawThumbs(); });
      });
    }
    drawThumbs();
    document.getElementById("fFoto").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      if (draftFotos[id].length >= 3) { toast("Maximaal 3 foto’s per bezoek."); return; }
      shrinkImage(file, 1024, function (url) { if (url) { draftFotos[id].push(url); drawThumbs(); } else toast("Deze foto kon niet worden geladen."); });
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var fv = document.getElementById("fVan").value, ft = document.getElementById("fTot").value;
      var tekst = document.getElementById("fTekst").value.trim();
      var signaal = document.getElementById("fSignaal").checked;
      var err = document.getElementById("fErr");
      if (!fv || !ft || mins(ft) <= mins(fv)) { err.textContent = "Controleer de tijden: ‘tot’ moet later zijn dan ‘van’."; return; }
      if (!onlyHousekeeping(c) && !tekst) { err.textContent = "Schrijf kort wat je met of voor " + c.roepnaam + " hebt gedaan."; document.getElementById("fTekst").focus(); return; }
      if (signaal && !tekst) { err.textContent = "Beschrijf kort wat je opviel."; document.getElementById("fTekst").focus(); return; }
      store.diensten[id] = {
        status: "voltooid", start: r.start || null, van: fv, tot: ft,
        km: Math.max(0, parseInt(document.getElementById("fKm").value, 10) || 0),
        opmerking: tekst, zichtbaar: document.getElementById("fZicht").checked, signaal: signaal,
        fotos: draftFotos[id].slice(), opgeslagen: new Date().toISOString()
      };
      if (!save()) return;
      state.edit = null; delete draftFotos[id];
      if (signaal) {
        state.prefill = { type: "Bijzonderheid bij cliënt", client: c.id, tekst: "Bij " + displayName(c) + " (" + datumKort(d.datum) + ") viel me op: " + tekst };
        toast("Bezoek afgerond. Stuur nu je melding naar de coördinator."); document.getElementById("toast").dataset.keep = "1";
        location.hash = "#/berichten";
      } else {
        toast("Bezoek afgerond en uren geaccordeerd.");
        renderDienst(id);
      }
    });
  }

  function shrinkImage(file, max, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement("canvas");
        cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        try { cb(cv.toDataURL("image/jpeg", 0.7)); } catch (e) { cb(null); }
      };
      img.onerror = function () { cb(null); };
      img.src = reader.result;
    };
    reader.onerror = function () { cb(null); };
    reader.readAsDataURL(file);
  }

          '<button type="button" class="icon-btn" data-del="' + i + '" aria-label="Verwijder moment">' + ICON.x + '</button></div>';
      }).join("") + '</div>' +
      '<button type="button" class="btn btn-secondary btn-sm" id="addRow">' + ICON.plus + 'Moment toevoegen</button>' +
      '<div class="grid2">' + fIn("startdatum", "Startdatum", d, { type: "date" }) + fIn("zorgverlener", "Vaste zorgverlener", d, { ph: "naam" }) + '</div>' +
    '</section>';

    if (step === 3) return '<section class="card form"><h2>Over de cliënt</h2>' +
      fArea("over", "Korte achtergrond", d, "Woonsituatie, familie, vroeger beroep, wat belangrijk is in het leven.", 4) +
      fArea("fijn", "Vindt fijn", d, "Bijv. wandelen, oude foto’s kijken, koffie met een koekje.", 2) +
      fArea("liever", "Liever niet", d, "Bijv. haast, harde tv, onverwachte wisselingen.", 2) +
      fArea("communicatie", "Communicatie", d, "Bijv. slechthorend links, korte zinnen, één vraag tegelijk.", 2) +
      '</section><section class="card form"><h2>Praktisch</h2>' +
      fArea("letOp", "Let op bij binnenkomst", d, "Sleutel/sleutelkluis, huisdieren, parkeren, bel werkt niet …", 2) +
      fArea("aandacht", "Aandachtspunten voor de begeleiding", d, "Alleen wat nodig is voor de begeleiding, bijv. valgevaar of beginnende vergeetachtigheid. Geen medisch dossier.", 3) +
      '<p class="hint">Niet-medische zorg: noteer alleen wat de zorgverlener moet weten. Medische zaken horen bij huisarts of wijkverpleging.</p>' +
    '</section>';

    // stap 4: afronden
    var c = intakeToClient(d, null);
    return '<section class="card form"><h2>Afspraken en toestemming</h2>' +
        fChk("tPrivacy", "Privacyreglement besproken; cliënt geeft toestemming om deze gegevens vast te leggen", d, true) +
        fChk("tVerslag", "Verslagen mogen gedeeld worden met de contactpersoon", d) +
        fChk("tFoto", "Foto’s maken tijdens activiteiten mag", d) +
        fChk("tSocial", "Foto’s mogen (zonder naam) op social media", d) +
        fChk("tKlacht", "Klachtenregeling en geschillencommissie uitgelegd", d) +
        fChk("tOvereenkomst", "Zorgovereenkomst / opdrachtbevestiging getekend", d) +
        '<div class="grid2">' + fIn("intakeDoor", "Intake gedaan door", d) + fIn("intakeDatum", "Datum intake", d, { type: "date" }) + '</div>' +
      '</section>' +
      '<section class="card"><h2>Samenvatting</h2><div class="kv">' +
        kv("Naam", [c.aanhef !== "—" ? c.aanhef : "", c.voornaam, c.achternaam].filter(Boolean).join(" ")) +
        kv("Adres", c.adres + ", " + c.postcode + " " + c.woonplaats) +
        kv("Zorg", c.zorg.join(", ") || "—") +
        kv("Financiering", c.financiering) +
        kv("Vaste momenten", roosterTekst(c)) +
        kv("Start", isoToNL(d.startdatum) || "—") +
        kv("Contactpersoon", c.contact.naam + (d.contactRelatie ? " (" + d.contactRelatie + ")" : "")) +
      '</div></section>' +
      '<button class="btn btn-ghost" type="button" id="printBtn">' + ICON.download + 'Afdrukken of opslaan als PDF</button>';
  }

  function collectIntake(d) {
    view.querySelectorAll("[data-f]").forEach(function (el) {
      d[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value;
    });
    var z = view.querySelectorAll("[data-zorg]");
    if (z.length) { d.zorg = []; z.forEach(function (el) { if (el.checked) d.zorg.push(el.dataset.zorg); }); }
    view.querySelectorAll("[data-r]").forEach(function (el) { var r = d.rooster[+el.dataset.i]; if (r) r[el.dataset.r] = el.value; });
  }
  function validateIntake(step, d) {
    if (step === 0) {
      if (!d.voornaam.trim() && d.aanhef !== "Fam.") return ["voornaam", "Vul de voornaam in."];
      if (!d.achternaam.trim()) return ["achternaam", "Vul de achternaam in."];
      if (!d.adres.trim()) return ["adres", "Vul straat en huisnummer in."];
      if (!/^\d{4}\s?[A-Za-z]{2}$/.test(d.postcode.trim())) return ["postcode", "Vul een geldige postcode in, bijvoorbeeld 2801 AB."];
      if (!d.woonplaats.trim()) return ["woonplaats", "Vul de woonplaats in."];
    }
    if (step === 2) {
      if (!d.zorg.length) return [null, "Kies minstens één soort zorg."];
      for (var i = 0; i < d.rooster.length; i++) {
        if (mins(d.rooster[i].tot) <= mins(d.rooster[i].van)) return [null, "Bij een bezoekmoment is ‘tot’ niet later dan ‘van’."];
      }
    }
    if (step === 4 && !d.tPrivacy) return ["tPrivacy", "Zonder toestemming voor het vastleggen van gegevens kan de cliënt niet worden opgeslagen."];
    return null;
  }

  function renderIntake(editId) {
    var existing = editId ? findClient(editId) : null;
    if (editId && (!existing || !existing.eigen)) { location.hash = "#/clienten"; return; }
    var key = editId || "nieuw";
    if (!state.intake || state.intake.key !== key) {
      var draft = (!editId && store.intakeConcept) ? store.intakeConcept : null;
      state.intake = { key: key, step: 0, d: existing ? clientToIntake(existing) : (draft || emptyIntake()), restored: !!draft };
    }
    var it = state.intake, d = it.d, step = it.step;
    var title = existing ? "Intake bewerken" : "Nieuwe cliënt";

    view.innerHTML =
      '<header class="hero hero-sm">' +
        '<div class="hero-top"><a class="round-btn" href="' + (existing ? '#/client/' + esc(existing.id) : '#/clienten') + '" aria-label="Terug" id="intakeBack">' + ICON.back + '</a>' +
        '<div class="sub">Stap ' + (step + 1) + ' van ' + STAPPEN.length + ' · ' + esc(STAPPEN[step]) + '</div><span style="width:44px"></span></div>' +
        '<h1>' + esc(title) + '</h1>' +
        '<ol class="steps" aria-label="Voortgang">' + STAPPEN.map(function (s, i) {
          return '<li class="' + (i < step ? 'done' : i === step ? 'now' : '') + '"' + (i === step ? ' aria-current="step"' : '') + '><span class="sr">' + esc(s) + '</span></li>';
        }).join("") + '</ol>' +
      '</header>' +
      '<form class="stack" id="intakeForm" novalidate>' +
        (it.restored && step === 0 ? '<div class="note-ok">' + ICON.info + '<span>Je eerdere, niet-afgemaakte intake is teruggezet. <button type="button" class="linkbtn" id="resetDraft">Opnieuw beginnen</button></span></div>' : '') +
        intakeStep(step, d) +
        '<p class="error" id="iErr" role="alert"></p>' +
        '<div class="grid2 nav-btns">' +
          (step > 0 ? '<button class="btn btn-secondary" type="button" id="prevStep">Vorige</button>' : '<span></span>') +
          (step < STAPPEN.length - 1 ? '<button class="btn btn-primary" type="submit">Volgende</button>' : '<button class="btn btn-primary" type="submit">' + ICON.check + (existing ? 'Opslaan' : 'Cliënt toevoegen') + '</button>') +
        '</div>' +
        (existing && step === STAPPEN.length - 1 ? '<button class="btn btn-ghost danger" type="button" id="delClient">Cliënt verwijderen</button>' : '') +
        '<p class="hint center">Velden met <span class="req">*</span> zijn verplicht. Alles wordt alleen op dit toestel bewaard.</p>' +
      '</form>';

    function keepDraft() { if (!existing) { store.intakeConcept = d; save(); } }
    function go(n) { it.step = n; it.restored = false; renderIntake(editId); view.scrollTop = 0; }

    var form = document.getElementById("intakeForm");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      collectIntake(d);
      var bad = validateIntake(step, d);
      if (bad) {
        document.getElementById("iErr").textContent = bad[1];
        var el = bad[0] && view.querySelector('[data-f="' + bad[0] + '"]');
        if (el) el.focus();
        return;
      }
      if (step < STAPPEN.length - 1) { keepDraft(); go(step + 1); return; }
      var c = intakeToClient(d, existing);
      if (existing) {
        for (var i = 0; i < store.clienten.length; i++) if (store.clienten[i].id === existing.id) store.clienten[i] = c;
      } else {
        store.clienten.push(c);
        store.intakeConcept = null;
      }
      if (!save()) return;
      rebuildClients();
      state.intake = null;
      toast(existing ? "Gegevens opgeslagen." : displayName(c) + " is toegevoegd.");
      location.hash = "#/client/" + c.id;
    });
    var prev = document.getElementById("prevStep");
    if (prev) prev.addEventListener("click", function () { collectIntake(d); keepDraft(); go(step - 1); });
    document.getElementById("intakeBack").addEventListener("click", function () { collectIntake(d); keepDraft(); state.intake = null; });
    var reset = document.getElementById("resetDraft");
    if (reset) reset.addEventListener("click", function () { store.intakeConcept = null; save(); state.intake = null; renderIntake(null); });
    var addRow = document.getElementById("addRow");
    if (addRow) addRow.addEventListener("click", function () {
      collectIntake(d);
      var last = d.rooster[d.rooster.length - 1] || { dag: "ma", van: "10:00", tot: "12:00" };
      d.rooster.push({ dag: last.dag, van: last.van, tot: last.tot });
      renderIntake(editId);
    });
    view.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () { collectIntake(d); d.rooster.splice(+b.dataset.del, 1); renderIntake(editId); });
    });
    var pr = document.getElementById("printBtn");
    if (pr) pr.addEventListener("click", function () { collectIntake(d); printIntake(d); });
    var del = document.getElementById("delClient");
    if (del) del.addEventListener("click", function () {
      if (del.dataset.sure !== "1") { del.dataset.sure = "1"; del.textContent = "Weet je het zeker? Tik nogmaals om te verwijderen"; return; }
      store.clienten = store.clienten.filter(function (x) { return x.id !== existing.id; });
      save(); rebuildClients(); state.intake = null;
      if (state.lastClient === existing.id) state.lastClient = clients.length ? clients[0].id : null;
      toast("Cliënt verwijderd.");
      location.hash = "#/clienten";
    });
  }

  // Afdrukbaar intakeverslag (ook als PDF op te slaan via de printfunctie van de telefoon/computer)
  function printIntake(d) {
    var c = intakeToClient(d, null);
    var ja = function (b) { return b ? "Ja" : "Nee"; };
    var rows = [
      ["Persoonsgegevens", [
        ["Naam", [d.aanhef !== "—" ? d.aanhef : "", d.voornaam, d.achternaam].filter(Boolean).join(" ")],
        ["Roepnaam", d.roepnaam], ["Geboortedatum", isoToNL(d.geboortedatum)],
        ["Adres", d.adres + ", " + d.postcode + " " + d.woonplaats], ["Telefoon", d.telefoon], ["E-mail", d.email], ["Huisarts", d.huisarts]]],
      ["Contactpersonen", [
        ["Eerste contactpersoon", [d.contactNaam, d.contactRelatie].filter(Boolean).join(" – ")],
        ["Telefoon / e-mail", [d.contactTelefoon, d.contactEmail].filter(Boolean).join(" / ")],
        ["Casemanager dementie", d.casemanager], ["Wijkteam / Wmo", d.wijkteam]]],
      ["Zorgvraag", [
        ["Hulpvraag", d.hulpvraag], ["Soort zorg", d.zorg.join(", ")], ["Financiering", c.financiering],
        ["Indicatie t/m", isoToNL(d.indicatieTot)], ["Uurtarief", d.tarief ? "€ " + d.tarief : ""],
        ["Vaste momenten", roosterTekst(c)], ["Startdatum", isoToNL(d.startdatum)], ["Vaste zorgverlener", d.zorgverlener]]],
      ["Over de cliënt", [
        ["Achtergrond", d.over], ["Vindt fijn", d.fijn], ["Liever niet", d.liever], ["Communicatie", d.communicatie],
        ["Let op bij binnenkomst", d.letOp], ["Aandachtspunten", d.aandacht]]],
      ["Afspraken en toestemming", [
        ["Toestemming vastleggen gegevens", ja(d.tPrivacy)], ["Verslagen delen met contactpersoon", ja(d.tVerslag)],
        ["Foto’s tijdens activiteiten", ja(d.tFoto)], ["Foto’s op social media", ja(d.tSocial)],
        ["Klachtenregeling uitgelegd", ja(d.tKlacht)], ["Zorgovereenkomst getekend", ja(d.tOvereenkomst)],
        ["Intake door", d.intakeDoor], ["Datum intake", isoToNL(d.intakeDatum)]]]
    ];
    var box = document.getElementById("printArea") || document.body.appendChild(Object.assign(document.createElement("div"), { id: "printArea" }));
    box.innerHTML = '<h1>Intakeformulier – ' + esc(ORG.naam || "") + '</h1>' +
      rows.map(function (sec) {
        return '<h2>' + esc(sec[0]) + '</h2><table>' + sec[1].map(function (r) { return '<tr><th>' + esc(r[0]) + '</th><td>' + esc(r[1] || "") + '</td></tr>'; }).join("") + '</table>';
      }).join("") +
      '<div class="sign"><div>Handtekening cliënt / vertegenwoordiger<span></span></div><div>Handtekening ' + esc(ORG.naam || "zorgbureau") + '<span></span></div></div>';
    window.print();
  }

  // ---------- Navigatie ----------
  function route() {
    var t = document.getElementById("toast");
    if (t && !t.dataset.keep) t.classList.remove("show");
    if (t) delete t.dataset.keep;
    var parts = (location.hash || "#/clienten").replace(/^#\/?/, "").split("/");
    var page = parts[0] || "clienten", active = page;
    if (page !== "dienst") state.edit = null;

    if (page === "client") renderClient(parts[1]);
    else if (page === "bezoek") renderBezoek();
    else if (page === "dienst") { renderDienst(decodeURIComponent(parts[1] || "")); active = "bezoek"; }
    else if (page === "verslag") renderVerslag();
    else if (page === "uren") renderUren();
    else if (page === "berichten") { renderBerichten(); active = ""; }
    else if (page === "nieuw") { renderIntake(null); active = "clienten"; }
    else if (page === "intake") { renderIntake(decodeURIComponent(parts[1] || "")); active = "clienten"; }
    else { active = "clienten"; renderOverview(); }

    tabs.forEach(function (t) {
      if (t.dataset.tab === active) t.setAttribute("aria-current", "page");
      else t.removeAttribute("aria-current");
      if (t.dataset.tab === "client" && state.lastClient) t.setAttribute("href", "#/client/" + state.lastClient);
    });
    view.scrollTop = 0;
    view.focus({ preventScroll: true });
  }

  window.addEventListener("hashchange", route);
  route();
})();

  </script>
</body>
</html>
